# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven
permissions:
  contents: read
  pages: write
  id-token: write
on:
  push:
    branches: [ "master" ]
jobs:
  build:

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v6.0.3
    - name: Set up JDK 17
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6.0.0
    - name: Create test config
      run: |
        mkdir -p src/test/resources
        cat > src/test/resources/config.properties <<'EOF'
        baseUrl=https://www.amazon.com/
        browser=chrome-headless
        timeout=10
        email=
        pass=
        existingProduct=HP VietNam
        nonExistingProduct=acdxyz3245
        EOF
    - name: Build with Maven
      run: mvn clean -Dtest=tests.Register.Search#verifySearchCriteriaReturnsMultipleProducts+verifySearchFieldHasPlaceholder+verifySearchingUsingSearchCriteriaField+verifySearchUsingProductDescriptionText test
    - name: Generate Allure Report
      run: mvn allure:report
    - name: Upload Allure Report artifact
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: ./target/site/allure-maven-plugin
    - name: Deploy Allure Report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5.0.0
